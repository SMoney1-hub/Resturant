<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Delivery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🍔 Alpha Bite</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Menu</a></li>
        <li><a href="#">Offers</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="actions">
      <button class="login-btn">Login</button>
      <button class="lang-toggle">EN</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Order Tasty &<br><span>Fresh Food</span><br>anytime!</h1>
      <p>Just confirm your order and enjoy our delicious food at home.</p>
      <button class="order-btn">Order Now</button>
    </div>
    <div class="hero-image">
      <img src="foodd2.webp" alt="Food Bowl">
    </div>
  </section>

  <section class="categories">
    <div class="category-card">
      <img src="food1.jpg" alt="Burger">
      <p>Burger</p>
    </div>
    <div class="category-card">
      <img src="food3.jpg" alt="Salad">
      <p>Streak</p>
    </div>
    <div class="category-card">
      <img src="food5.avif" alt="Snacks">
      <p>Salads</p>
    </div>
    <div class="category-card">
      <img src="food4.webp" alt="Noodles">
      <p>Sushi</p>
    </div>
  </section>
</body>
</html>
